notes: >-
  The discovery surface that matters here is on the MCP host, not the website. The
  marketing site publishes nothing under /.well-known/, but mcp.cloverleaf.ai serves a
  complete RFC 9728 + RFC 8414 authorization discovery chain pointing at the company's
  own Auth0 tenant at auth.cloverleaf.ai, and that chain is what lets an MCP client
  discover how to authenticate. A prior round recorded only the www host and its five
