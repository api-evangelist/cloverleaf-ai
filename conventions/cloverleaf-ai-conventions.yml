  discovery: >-
    RFC 9728 — the 401 challenge names the protected-resource metadata URL, which names
    the authorization server. A client needs no out-of-band configuration.
  detail: authentication/cloverleaf-ai-authentication.yml

transport:
  protocol: MCP Streamable HTTP
  endpoint: https://mcp.cloverleaf.ai/
