  session:
    header: Mcp-Session-Id
    exposed_via: 'Access-Control-Expose-Headers: Mcp-Session-Id'
    note: server-issued session id, returned on initialize and echoed on later calls
  protocol_version_header: mcp-protocol-version
  cors:
    allow_origin: '*'
    allow_headers: [Content-Type, mcp-session-id, mcp-protocol-version, Authorization, Accept, User-Agent, X-Requested-With]

