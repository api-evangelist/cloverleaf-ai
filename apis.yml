apis:
- name: Cloverleaf AI MCP Server
  description: >-
    A remote, OAuth-protected Model Context Protocol server that exposes Cloverleaf AI's
    government meeting intelligence to AI agents and assistants. Found by host discovery
    (mcp.cloverleaf.ai) rather than from documentation — the company publishes no
    developer portal and never mentions the server on its marketing site. The endpoint is
    the host root and speaks MCP Streamable HTTP (GET/POST/OPTIONS, Mcp-Session-Id). All
    calls, including initialize and tools/list, require an OAuth 2.0 bearer token issued
    by the company's own Auth0 tenant at auth.cloverleaf.ai; the server advertises the
    full RFC 9728 + RFC 8414 discovery chain with PKCE S256 and dynamic client
    registration, so a generic MCP client can authenticate without hand-issued
    credentials. The tool set itself is auth-gated and is not published anywhere.
  humanURL: https://www.cloverleaf.ai/how-it-works/
  baseURL: https://mcp.cloverleaf.ai/
